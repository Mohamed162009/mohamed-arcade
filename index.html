        let currentActiveCategory = 'all';

        function renderGames(data) {
            const grid = document.getElementById('gamesGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            data.forEach((game) => {
                const gameCard = document.createElement('div');
                gameCard.className = "bg-slate-800 rounded-2xl overflow-hidden border border-slate-700/80 shadow-md cursor-pointer hover:border-brand-500 transition duration-200 flex flex-col justify-between";
                gameCard.onclick = () => openGameModal(game);

                gameCard.innerHTML = `
                    <div class="relative aspect-[4/3] w-full bg-slate-900">
                        <img src="${game.thumb}" alt="${game.title}" class="w-full h-full object-cover" loading="lazy">
                        <span class="absolute top-2 right-2 bg-slate-950/80 text-brand-500 text-[9px] font-black px-2 py-0.5 rounded-lg border border-slate-800">
                            ${game.badge}
                        </span>
                    </div>
                    <div class="p-2.5 flex flex-col gap-0.5">
                        <h3 class="text-xs font-bold text-slate-100 truncate">${game.title}</h3>
                        <div class="flex items-center justify-between text-[10px] text-slate-400">
                            <span>${game.category}</span>
                            <span class="text-brand-500 font-bold"><i class="fa-solid fa-star text-[9px]"></i> 4.9</span>
                        </div>
                    </div>
                `;
                grid.appendChild(gameCard);
            });
        }

        function filterCategory(cat) {
            currentActiveCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl border border-slate-700 whitespace-nowrap";
            });
            const activeBtn = document.getElementById(`btn-${cat}`);
            if (activeBtn) {
                activeBtn.className = "cat-btn bg-brand-500 text-white px-4 py-2 rounded-xl shadow-md whitespace-nowrap font-bold";
            }
            document.getElementById('searchInput').value = '';
            if (cat === 'all') {
                renderGames(gamesList);
            } else {
                renderGames(gamesList.filter(g => g.category.toLowerCase() === cat.toLowerCase()));
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            renderGames(gamesList.filter(game => {
                const matchesCategory = currentActiveCategory === 'all' || game.category.toLowerCase() === currentActiveCategory.toLowerCase();
                const matchesQuery = game.title.toLowerCase().includes(query) || game.badge.toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            }));
        }

        function openGameModal(game) {
            document.getElementById('modalGameTitle').innerText = game.title;
            document.getElementById('modalGameCategory').innerText = game.category + " • " + game.badge;
            document.getElementById('modalGameThumb').src = game.thumb;
            document.getElementById('gameIframe').src = game.url;
            const modal = document.getElementById('gameModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeGameModal() {
            const modal = document.getElementById('gameModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('gameIframe').src = '';
            document.body.style.overflow = 'auto';
        }

        function toggleFullscreen() {
            const container = document.getElementById('iframeContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) container.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        window.onload = function() { renderGames(gamesList); };
    </script>
