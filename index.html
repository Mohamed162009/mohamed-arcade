<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Mohamed Arcade - بوابة الألعاب المجانية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
            width: 200px;
            transition: 0.3s;
        }
        .search-box:focus {
            width: 250px;
            border-color: #38bdf8;
        }
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 2rem;
        }
        .game-container.active {
            display: flex;
        }
        .iframe-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .back-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: #dc2626;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }
        .game-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .game-card h3 {
            padding: 12px;
            font-size: 1rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        footer {
            background: #1e293b;
            text-align: center;
            padding: 1rem;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: auto;
        }
        @media (max-width: 600px) {
            .iframe-wrapper {
                height: 450px;
            }
            main {
                padding: 1rem;
            }
        }
    </style>

    <!-- Monetag In-Page Push (الإعلان الهادي من غير انبثاق) -->
    <script>(function(s){s.dataset.zone='12081088',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="closeGame()">🎮 Mohamed Arcade</a>
        <input type="text" class="search-box" id="searchInput" placeholder="أبحث عن لعبة..." oninput="filterGames()">
    </header>

    <main>
        <!-- منطقة الشاشة الرئيسية للعب -->
        <div class="game-container" id="gameScreen">
            <button class="back-btn" onclick="closeGame()">⬅ العودة لقائمة الألعاب</button>
            <div class="iframe-wrapper">
                <iframe id="gameFrame" src="" allowfullscreen></iframe>
            </div>
        </div>

        <!-- شبكة الألعاب -->
        <div class="games-grid" id="gamesGrid">
            <!-- سيتم تحميل الألعاب تلقائياً هنا -->
        </div>
    </main>

    <footer>
        <p>© 2026 Mohamed Arcade - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        const games = [
            { name: "Subway Surfers", url: "https://html5.gamedistribution.com/f2a4f4d2f6234f9a888c3a1b8599cf8e/", thumb: "https://img.gamedistribution.com/f2a4f4d2f6234f9a888c3a1b8599cf8e-512x512.jpeg" },
            { name: "Moto X3M", url: "https://html5.gamedistribution.com/5c9b68ebf9f74a00a133d59648a3d6d0/", thumb: "https://img.gamedistribution.com/5c9b68ebf9f74a00a133d59648a3d6d0-512x512.jpeg" },
            { name: "Stickman Hook", url: "https://html5.gamedistribution.com/84c8a2ef81974ef387928d11634731a5/", thumb: "https://img.gamedistribution.com/84c8a2ef81974ef387928d11634731a5-512x512.jpeg" },
            { name: "Temple Run 2", url: "https://html5.gamedistribution.com/a42b10292723438289bf678c2e646738/", thumb: "https://img.gamedistribution.com/a42b10292723438289bf678c2e646738-512x512.jpeg" },
            { name: "Car Rush", url: "https://html5.gamedistribution.com/1a742886f3764b8a8b16c8ec081b859b/", thumb: "https://img.gamedistribution.com/1a742886f3764b8a8b16c8ec081b859b-512x512.jpeg" },
            { name: "8 Ball Pool", url: "https://html5.gamedistribution.com/488ef9229f604b3080e7223b2e38c2ef/", thumb: "https://img.gamedistribution.com/488ef9229f604b3080e7223b2e38c2ef-512x512.jpeg" }
        ];

        const grid = document.getElementById('gamesGrid');
        const gameScreen = document.getElementById('gameScreen');
        const gameFrame = document.getElementById('gameFrame');

        function renderGames(list) {
            grid.innerHTML = '';
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => playGame(game.url);
                card.innerHTML = `
                    <img src="${game.thumb}" alt="${game.name}" loading="lazy">
                    <h3>${game.name}</h3>
                `;
                grid.appendChild(card);
            });
        }

        function playGame(url) {
            gameFrame.src = url;
            gameScreen.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeGame() {
            gameFrame.src = '';
            gameScreen.classList.remove('active');
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = games.filter(g => g.name.toLowerCase().includes(query));
            renderGames(filtered);
        }

        // تشغيل الألعاب عند التحميل
        renderGames(games);
    </script>
</body>
</html>
